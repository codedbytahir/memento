AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memento - The Autonomous Biographer (TypeScript/Next.js)

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        DEV_MODE: 'true'
        SESSIONS_TABLE: !Ref SessionsTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        IMAGES_BUCKET: !Ref ImagesRawBucket
        PDF_BUCKET: !Ref PdfsFinalBucket

Resources:
  # DynamoDB Tables
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: memento-sessions-ts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: memento-connections-ts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl

  # S3 Buckets
  ImagesRawBucket:
    Type: AWS::S3::Bucket
  PdfsFinalBucket:
    Type: AWS::S3::Bucket

  # SQS Queues
  ProcessingQueue:
    Type: AWS::SQS::Queue
  PdfQueue:
    Type: AWS::SQS::Queue

  # Next.js App (SSR & API)
  # In a real SAM setup, we'd use something like @sentry/nextjs or custom build
  # For the demo, we'll treat it as a single Lambda function using the built output
  NextAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./frontend # SAM will need to build this
      Handler: server.handler # Placeholder for Next.js adapter
      Environment:
        Variables:
          PROCESSING_QUEUE_URL: !Ref ProcessingQueue
          WEBSOCKET_URL: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Background Lambdas
  WsHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [index.ts]
    Properties:
      CodeUri: backend/lambdas/ws-handler/
      Handler: index.handler
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - Statement:
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:Converse]
            Resource: '*'
        - Statement:
            Effect: Allow
            Action: [execute-api:ManageConnections]
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  StoryProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [index.ts]
    Properties:
      CodeUri: backend/lambdas/story-processor/
      Handler: index.handler
      Environment:
        Variables:
          PDF_QUEUE_URL: !Ref PdfQueue
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3ReadPolicy: { BucketName: !Ref ImagesRawBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt PdfQueue.QueueName }
        - Statement:
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:Converse]
            Resource: '*'
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1

  PdfGeneratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [index.ts]
    Properties:
      CodeUri: backend/lambdas/pdf-generator/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3ReadPolicy: { BucketName: !Ref ImagesRawBucket }
        - S3CrudPolicy: { BucketName: !Ref PdfsFinalBucket }
        - Statement:
            Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource: '*'
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PdfQueue.Arn
            BatchSize: 1

  # API Gateway (WebSocket)
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: memento-websocket-api-ts
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${WsIntegration}'

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations'

  # ... other routes similar to Python template ...

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  WebSocketUrl:
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
