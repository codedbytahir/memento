AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memento - The Autonomous Biographer

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        DEV_MODE: 'true'

Resources:
  # DynamoDB Tables
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: memento-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: memento-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl

  # S3 Buckets
  ImagesRawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'memento-images-raw-${AWS::AccountId}-${AWS::Region}'

  PdfsFinalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'memento-pdfs-final-${AWS::AccountId}-${AWS::Region}'

  # SQS Queues
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: memento-processing-queue
      VisibilityTimeout: 300

  PdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: memento-pdf-queue
      VisibilityTimeout: 600

  # Lambda Functions
  StartSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/start_session/
      Handler: app.lambda_handler
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          IMAGES_BUCKET: !Ref ImagesRawBucket
          WEBSOCKET_URL: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesRawBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start-session
            Method: POST
            RestApiId: !Ref RestApi

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/api_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          PROCESSING_QUEUE_URL: !Ref ProcessingQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProcessingQueue.QueueName
      Events:
        GenerateApi:
          Type: Api
          Properties:
            Path: /generate
            Method: POST
            RestApiId: !Ref RestApi
        StatusApi:
          Type: Api
          Properties:
            Path: /pdf-status/{session_id}
            Method: GET
            RestApiId: !Ref RestApi
        EmailApi:
          Type: Api
          Properties:
            Path: /send-email
            Method: POST
            RestApiId: !Ref RestApi

  WsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/ws_handler/
      Handler: app.lambda_handler
      Timeout: 900
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:Converse
            Resource: '*'
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  StoryProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/story_processor/
      Handler: app.lambda_handler
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          IMAGES_BUCKET: !Ref ImagesRawBucket
          PDF_QUEUE_URL: !Ref PdfQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - S3ReadPolicy:
            BucketName: !Ref ImagesRawBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PdfQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:Converse
            Resource: '*'
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1

  PdfGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/pdf_generator/
      Handler: app.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          IMAGES_BUCKET: !Ref ImagesRawBucket
          PDF_BUCKET: !Ref PdfsFinalBucket
          FROM_EMAIL: 'noreply@memento-biographer.com'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - S3ReadPolicy:
            BucketName: !Ref ImagesRawBucket
        - S3CrudPolicy:
            BucketName: !Ref PdfsFinalBucket
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: '*'
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PdfQueue.Arn
            BatchSize: 1

  # API Gateway
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET, POST, OPTIONS'"

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: memento-websocket-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaConnectIntegration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${LambdaDisconnectIntegration}'

  MessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: message
      Target: !Sub 'integrations/${LambdaMessageIntegration}'

  LambdaConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations'

  LambdaDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations'

  LambdaMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations'

  Deployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - MessageRoute
    Properties:
      ApiId: !Ref WebSocketApi

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: prod
      Description: Prod Stage
      DeploymentId: !Ref Deployment
      ApiId: !Ref WebSocketApi

  # Permissions for API Gateway to call Lambda
  WsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsHandlerFunction
      Principal: apigateway.amazonaws.com

Outputs:
  RestApiUrl:
    Description: "REST API endpoint URL"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebSocketUrl:
    Description: "WebSocket API endpoint URL"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
